name: "Mirror to Vercel-connected repo"

on:
  push:
    branches:
      - main-stores-stihl

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to mohcly/djati-stihl main
        run: |
          git push "https://mohcly:${{ secrets.MOHCLY_DEPLOY_TOKEN }}@github.com/mohcly/djati-stihl.git" "HEAD:main" --force
